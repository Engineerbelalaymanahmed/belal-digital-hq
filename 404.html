<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page not found</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000;color:#f6f3ec;font:16px system-ui,sans-serif;text-align:center}a{color:#e6c27a;font-weight:600}</style></head>
<body><main><h1>Page not found</h1><p>The page you requested does not exist.</p><p><a id="h" href="/">Go to the home page</a></p></main>
<script>if(location.hostname.endsWith('github.io')){var s=location.pathname.split('/')[1];if(s&&!/^(information|portfolio|certifications|social|contact)$/.test(s)&&location.hostname.split('.')[0].toLowerCase()!==s.toLowerCase())document.getElementById('h').href='/'+s+'/'}</script></body></html>
